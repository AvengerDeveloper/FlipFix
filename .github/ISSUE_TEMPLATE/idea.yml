name: Idea
description: Suggest something FlipFix could do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        FlipFix stays offline, asks for as few permissions as it can, and never reads what's on the screen. Ideas that need internet access, location or new permissions are unlikely to fit.
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like FlipFix to do, and when would you use it?
    validations:
      required: true
